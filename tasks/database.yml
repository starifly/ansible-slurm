---
# Database node configuration tasks

# Get system memory information
- name: Get system memory information
  ansible.builtin.setup:
    filter: ansible_memtotal_mb
  register: memory_facts

# Calculate innodb_buffer_pool_size as 75% of memory
- name: Set innodb_buffer_pool_size variable
  set_fact:
    innodb_buffer_pool_size: "{{ (memory_facts.ansible_facts.ansible_memtotal_mb * 0.75) | int }}M"

# Add performance parameters to MariaDB configuration file
- name: Get MariaDB configuration file path
  set_fact:
    mysql_conf_path: "{{ '/etc/my.cnf' if ansible_os_family == 'RedHat' else '/etc/mysql/my.cnf' }}"

- name: Ensure MariaDB configuration file exists
  file:
    path: "{{ mysql_conf_path }}"
    state: file
  register: mysql_conf_check
  ignore_errors: yes

- name: Create MariaDB configuration file (if not exists)
  file:
    path: "{{ mysql_conf_path }}"
    state: touch
    owner: root
    group: root
    mode: '0644'
  when: mysql_conf_check.failed is defined and mysql_conf_check.failed

- name: Add performance parameters to MariaDB configuration file
  blockinfile:
    path: "{{ mysql_conf_path }}"
    block: |
      [mysqld]
      innodb_buffer_pool_size = {{ innodb_buffer_pool_size }}
      innodb_log_file_size = 64M
      innodb_lock_wait_timeout = 900
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR SLURM PERFORMANCE SETTINGS"
    create: yes
  notify: restart mariadb

# Start MariaDB service
- name: Start and enable MariaDB service
  systemd:
    name: mariadb
    state: started
    enabled: yes
  when: slurm_start_services | default(true)

- name: Copy .my.cnf file with root credentials
  template:
    src: my.cnf.j2
    dest: /root/.my.cnf
    mode: '0600'
  vars:
    mysql_root_password: "{{ mariadb_root_password }}"
  when: ansible_os_family == 'Debian'

- name: Set MariaDB root password (Debian/Ubuntu)
  mysql_user:
    name: root
    password: "{{ mariadb_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  when: ansible_os_family == 'Debian'

- name: Check if MariaDB root password is empty
  command: mysql -u root --skip-password -e "SELECT 1"
  register: empty_password_check
  changed_when: false
  failed_when: false
  check_mode: no
  when: ansible_os_family == 'RedHat'

- name: Set MariaDB root password (RedHat/CentOS)
  mysql_user:
    name: root
    password: "{{ mariadb_root_password }}"
    login_unix_socket: /var/lib/mysql/mysql.sock
    state: present
  when: "ansible_os_family == 'RedHat' and empty_password_check.rc == 0"

- name: Copy .my.cnf file with root credentials
  template:
    src: my.cnf.j2
    dest: /root/.my.cnf
    mode: '0600'
  vars:
    mysql_root_password: "{{ mariadb_root_password }}"
  when: ansible_os_family == 'RedHat'

- name: Prohibit root remote login
  shell: |
    mysql -uroot -p{{ mariadb_root_password }} -e \
    "DELETE FROM mysql.user WHERE User='root' AND Host NOT IN ('localhost', '127.0.0.1', '::1');"
  changed_when: false

- name: Remove anonymous users
  shell: |
    mysql -uroot -p{{ mariadb_root_password }} -e \
    "DELETE FROM mysql.user WHERE User='';"
  changed_when: false

- name: Remove test database
  shell: |
    mysql -uroot -p{{ mariadb_root_password }} -e \
    "DROP DATABASE IF EXISTS test;"
  changed_when: false

- name: Create slurmdb database
  mysql_db:
    name: "{{ slurm_db_name }}"
    state: present
    login_user: root
    login_password: "{{ mariadb_root_password }}"

- name: Create Slurm database user with permissions
  mysql_user:
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    name: "{{ slurm_db_user }}"
    password: "{{ slurm_db_pass }}"
    priv: "{{ slurm_db_name }}.*:ALL"
    host: localhost
    state: present

- name: Flush privileges
  shell: |
    mysql -uroot -p{{ mariadb_root_password }} -e \
    "FLUSH PRIVILEGES;"
  changed_when: false

- name: Remove .my.cnf file
  file:
    path: /root/.my.cnf
    state: absent

# Create slurmdbd service file
- name: Create slurmdbd service file
  template:
    src: slurmdbd.service.j2
    dest: /etc/systemd/system/slurmdbd.service
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd

# Configure slurmdbd
- name: Generate slurmdbd.conf configuration file
  template:
    src: slurmdbd.conf.j2
    dest: "{{ slurm_install_dir }}/etc/slurmdbd.conf"
    owner: "{{ slurm_user }}"
    group: "{{ slurm_group }}"
    mode: '0600'
  notify: restart slurmdbd

# Start and enable slurmdbd service
- name: Start and enable slurmdbd service
  systemd:
    name: slurmdbd
    state: started
    enabled: yes
  when: slurm_start_services | default(true)
