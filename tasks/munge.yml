---
# Munge authentication configuration tasks

# Get Munge user and group ID on controller node
- name: Get Munge user ID
  shell: id -u munge
  register: munge_uid
  when: "'master' in slurm_roles"
  changed_when: false

- name: Get Munge group ID
  shell: "getent group munge | cut -d: -f3"
  register: munge_gid
  when: "'master' in slurm_roles"
  changed_when: false

# Get current Munge user and group ID on compute nodes
- name: Get compute node current Munge user ID
  shell: id -u munge
  register: compute_munge_uid
  when: "'master' not in slurm_roles"
  changed_when: false

- name: Get compute node current Munge group ID
  shell: "getent group munge | cut -d: -f3"
  register: compute_munge_gid
  when: "'master' not in slurm_roles"
  changed_when: false

# Ensure Munge user and group IDs are consistent across all nodes, modify only if different
- name: Set Munge user ID
  user:
    name: munge
    uid: "{{ hostvars[slurm_control_machine]['munge_uid']['stdout'] }}"
  when: "'master' not in slurm_roles and compute_munge_uid.stdout != hostvars[slurm_control_machine]['munge_uid']['stdout']"
  notify: restart munged

- name: Set Munge group ID
  group:
    name: munge
    gid: "{{ hostvars[slurm_control_machine]['munge_gid']['stdout'] }}"
  when: "'master' not in slurm_roles and compute_munge_gid.stdout != hostvars[slurm_control_machine]['munge_gid']['stdout']"
  notify: restart munged

# Generate Munge key on controller node
- name: Generate Munge key (Debian/Ubuntu)
  shell: mungekey -f
  args:
    creates: "{{ munge_key_path }}"
  when: "'master' in slurm_roles and ansible_os_family == 'Debian'"

- name: Generate Munge key (RedHat/CentOS)
  shell: create-munge-key -f
  args:
    creates: "{{ munge_key_path }}"
  when: "'master' in slurm_roles and ansible_os_family == 'RedHat'"

# Get Munge key from controller node
- name: Get Munge key
  fetch:
    src: "{{ munge_key_path }}"
    dest: "/tmp/munge.key"
    flat: yes
  when: "'master' in slurm_roles"

# Distribute Munge key to all nodes
- name: Distribute Munge key
  copy:
    src: "/tmp/munge.key"
    dest: "{{ munge_key_path }}"
    owner: munge
    group: munge
    mode: '0400'
  when: "'master' not in slurm_roles"
  notify: restart munged

# Start and enable Munge service
- name: Start and enable Munge service
  systemd:
    name: munge
    state: started
    enabled: yes
  when: slurm_start_services | default(true)

- name: Verify munge is working correctly
  shell: munge -n | unmunge
  register: munge_test
  failed_when: munge_test.rc != 0
  changed_when: false
